<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Accesso')}"></head>
<body class="loginpage">
<div class="thememenu login-theme">
    <button type="button" id="theme-btn" aria-haspopup="true" title="Tema: giorno / notte / sistema"><svg class="ic"><use href="#i-theme"/></svg></button>
    <div class="menu" id="theme-menu" hidden>
        <button type="button" data-theme-set="light"><svg class="ic"><use href="#i-sun"/></svg>Giorno<svg class="ic tick"><use href="#i-check"/></svg></button>
        <button type="button" data-theme-set="dark"><svg class="ic"><use href="#i-moon"/></svg>Notte<svg class="ic tick"><use href="#i-check"/></svg></button>
        <button type="button" data-theme-set="system"><svg class="ic"><use href="#i-auto"/></svg>Sistema<svg class="ic tick"><use href="#i-check"/></svg></button>
    </div>
</div>
<div class="logincard">
    <div class="logo">Q</div>
    <h1>CPQIA</h1>
    <p class="muted" style="margin:0 0 24px">Configuratore di offerte commerciali</p>

    <div class="alert err" th:if="${error != null}" style="text-align:left"><svg class="ic"><use href="#i-warning"/></svg><span th:text="${error}"></span></div>
    <div class="alert ok" th:if="${loggedOut}" style="text-align:left"><svg class="ic"><use href="#i-check"/></svg><span>Sei uscito correttamente.</span></div>

    <a class="sso" th:classappend="${!googleEnabled} ? 'disabled'" th:href="${googleEnabled} ? @{/oauth2/authorization/google} : '#'">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Accedi con Google
    </a>
    <a class="sso" th:if="${devLogin}" th:href="@{/dev-login}" style="border-style:dashed">Accesso sviluppo (senza SSO)</a>

    <p class="hint" style="margin-top:22px" th:if="${!googleEnabled and !devLogin}">
        Nessun provider di accesso configurato: vedi cpqia.oauth.* nella configurazione del contesto.</p>
    <p class="hint" style="margin-top:22px">L'accesso è consentito solo agli utenti abilitati da un amministratore.</p>
</div>
<div th:replace="~{fragments/layout :: foot}"></div>
</body>
</html>
