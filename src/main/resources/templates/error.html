<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Errore')}"></head>
<body class="loginpage">
<div class="logincard">
    <div class="logo" style="background:var(--error)">!</div>
    <h1 th:text="${status} ?: 'Errore'">Errore</h1>
    <p th:if="${message != null}" th:text="${message}"></p>
    <p class="muted" th:text="${status == 403} ? 'Non sei abilitato a questa funzione.' : (${status == 404} ? 'Pagina non trovata.' : 'Si è verificato un errore imprevisto.')">Errore</p>
    <a class="btn" th:href="@{/offers}">Torna alle offerte</a>
</div>
<div th:replace="~{fragments/layout :: foot}"></div>
</body>
</html>
