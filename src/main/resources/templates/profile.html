<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profilo')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('')}"></div>
<main class="content"><div class="inner" style="max-width:720px">
    <div class="pagehead"><h1>Il mio profilo</h1></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card" th:if="${me != null}">
        <p class="muted" style="margin-top:0">I dati del profilo arrivano dalla configurazione utente gestita dall'amministratore e non sono modificabili da qui.</p>
        <div class="grid c2">
            <div class="field"><input type="text" th:value="${me.firstName}" disabled placeholder=" "><label class="on">Nome</label></div>
            <div class="field"><input type="text" th:value="${me.lastName}" disabled placeholder=" "><label class="on">Cognome</label></div>
            <div class="field"><input type="text" th:value="${me.initials}" disabled placeholder=" " style="text-transform:uppercase"><label class="on">Iniziali</label></div>
            <div class="field"><input type="text" th:value="${me.email}" disabled placeholder=" "><label class="on">Email</label></div>
            <div class="field"><input type="text" th:value="${me.administrator} ? 'Administrator' : 'Utente'" disabled placeholder=" "><label class="on">Ruolo</label></div>
            <div class="field"><input type="text" th:value="${me.agentCode}" disabled placeholder=" "><label class="on">Codice agente</label></div>
        </div>
    </div>
</div></main>
<div th:replace="~{fragments/layout :: foot}"></div>
</body>
</html>
