# ---------------------------------------------------------------------------------------------
# Valori di default. Ogni contesto Tomcat li sovrascrive in ${catalina.base}/conf/cpqia/<contesto>.properties
# (vedi deploy/cpqia.properties.example)
# ---------------------------------------------------------------------------------------------
spring.application.name=cpqia
cpqia.version=@project.version@
cpqia.build=@maven.build.timestamp@

# --- database PostgreSQL (alternativa: JNDI -> spring.datasource.jndi-name=java:comp/env/jdbc/cpqia)
spring.datasource.url=jdbc:postgresql://localhost:5432/cpqia
spring.datasource.username=cpqia
spring.datasource.password=cpqia

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=true
spring.mvc.hiddenmethod.filter.enabled=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=framework
spring.jackson.default-property-inclusion=non_null

# --- applicazione
# primo amministratore: alla prima autenticazione con questa email l'utente viene creato come administrator
cpqia.bootstrap-admin-email=enrico.raffaello@sanmarcoinformatica.it
# se true, chi accede per la prima volta viene registrato DISATTIVO e deve essere abilitato da un administrator
cpqia.auto-register=true
# accesso di sviluppo senza Google/Apple (SOLO sviluppo!)
cpqia.dev-login=true
cpqia.dev-login-email=admin@example.com

# --- OAuth2 Google (https://console.cloud.google.com -> Credenziali -> ID client OAuth)
# redirect URI da registrare: https://<host>/<contesto>/login/oauth2/code/google
# credenziali: NON scriverle qui (il file e' nel repository). In sviluppo: config/application.properties (non versionato); in produzione:
# conf/cpqia/<contesto>.properties (scritto dalla procedura di setup)
cpqia.oauth.google.client-id=
cpqia.oauth.google.client-secret=

# --- Sign in with Apple (https://developer.apple.com -> Identifiers -> Services ID)
# redirect URI da registrare: https://<host>/<contesto>/login/oauth2/code/apple  (obbligatorio HTTPS)
cpqia.oauth.apple.client-id=
cpqia.oauth.apple.team-id=
cpqia.oauth.apple.key-id=
# percorso del file .p8 scaricato da Apple (chiave privata PKCS8)
cpqia.oauth.apple.private-key-file=

# --- recupero automatico dati anagrafici dalla partita IVA (servizio VIES della Commissione Europea, gratuito, senza chiave)
# Il server deve poter raggiungere ec.europa.eu in HTTPS (eventuale proxy: -Dhttps.proxyHost / -Dhttps.proxyPort di Tomcat)
cpqia.vat-lookup.enabled=true
cpqia.vat-lookup.url=https://ec.europa.eu/taxation_customs/vies/rest-api/ms/{cc}/vat/{vat}
cpqia.vat-lookup.timeout-seconds=10

# --- modelli Word (copertina + licenze + attivita + varie + pagamenti + condizioni-gdpr)
# Se valorizzato, i file .docx vengono letti da questa cartella (se presenti) invece che dal WAR: si modificano senza ricompilare.
cpqia.template-dir=

# Distanza cliente -> sede piu' vicina: geocodifica (Nominatim/OpenStreetMap) e percorso stradale (OSRM)
cpqia.geo.enabled=true
cpqia.geo.nominatim-url=https://nominatim.openstreetmap.org/search
cpqia.geo.osrm-url=https://router.project-osrm.org/route/v1/driving
# OBBLIGATORIO per la policy di Nominatim/OpenStreetMap: indicare un recapito reale (se resta example.com il servizio risponde HTTP 403).
# Esempio: cpqia.geo.user-agent=CPQIA/1.0 (mario.rossi@tuaazienda.it)
cpqia.geo.user-agent=CPQIA/1.0 (enrico.raffaello@sanmarcoinformatica.it)
cpqia.geo.timeout-seconds=10
# se il percorso stradale non e' disponibile: distanza in linea d'aria x questo fattore (stima)
cpqia.geo.straight-line-factor=1.3

# Comuni d'Italia con provincia, regione e CAP: scaricati all'avvio se la tabella e' vuota (anche da Impostazioni > Comuni)
cpqia.geodata.auto-import=true
cpqia.geodata.url=https://raw.githubusercontent.com/matteocontrini/comuni-json/master/comuni.json



server.servlet.context-path=/cpqia