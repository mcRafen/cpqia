# =====================================================================================
# Configurazione di UN contesto CPQIA.
# Copiare in  $CATALINA_BASE/conf/cpqia/<nome-contesto>.properties
#   - cpqia.war        ->  http://host:8080/cpqia        ->  conf/cpqia/cpqia.properties
#   - cpqia-test.war   ->  http://host:8080/cpqia-test   ->  conf/cpqia/cpqia-test.properties
# Ogni contesto ha database, credenziali OAuth e amministratori propri.
# =====================================================================================

# ---- PostgreSQL (in alternativa JNDI: spring.datasource.jndi-name=java:comp/env/jdbc/cpqia, vedi context.xml.example)
spring.datasource.url=jdbc:postgresql://localhost:5432/cpqia
spring.datasource.username=cpqia
spring.datasource.password=CAMBIA_PASSWORD

# ---- Primo amministratore: alla prima autenticazione con questo account Google/Apple viene creato
#      come "administrator" attivo. Poi gli altri utenti si gestiscono da Amministrazione > Utenti e permessi.
cpqia.bootstrap-admin-email=enrico.raffaello@sanmarcoinformatica.it
# true = chi accede per la prima volta viene registrato NON abilitato (un administrator lo abilita)
cpqia.auto-register=true

# ---- Google (https://console.cloud.google.com > API e servizi > Credenziali > ID client OAuth, "Applicazione web")
#      URI di reindirizzamento autorizzato:  https://HOST/CONTESTO/login/oauth2/code/google
cpqia.oauth.google.client-id=CLIENT_ID_GOOGLE
cpqia.oauth.google.client-secret=CLIENT_SECRET_GOOGLE

# ---- Sign in with Apple (https://developer.apple.com > Certificates, Identifiers & Profiles)
#      1) Identifiers > Services IDs: il "Identifier" e' il client-id; abilitare "Sign in with Apple"
#         e registrare dominio e Return URL:  https://HOST/CONTESTO/login/oauth2/code/apple   (HTTPS obbligatorio)
#      2) Keys: creare una chiave con "Sign in with Apple", scaricare il file .p8 (key-id = ID della chiave)
cpqia.oauth.apple.client-id=
cpqia.oauth.apple.team-id=
cpqia.oauth.apple.key-id=
cpqia.oauth.apple.private-key-file=/opt/tomcat/conf/cpqia/AuthKey_XXXXXXXXXX.p8

# ---- Solo sviluppo: accesso senza Google/Apple (NON abilitare in produzione)
cpqia.dev-login=false
cpqia.dev-login-email=admin@example.com

# ---- Modelli Word: cartella con offer-template.docx, licenze.docx, attivita.docx, varie.docx, pagamenti.docx, condizioni-gdpr.docx
#      (se vuota si usano quelli inclusi nel WAR). Si possono modificare con Word senza ricompilare.
cpqia.template-dir=
